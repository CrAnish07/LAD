<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">LAD dashboard preview</title>
  <desc id="desc">Illustrative view of the LAD observability dashboard, including log volume, anomaly count, anomaly rate, service health, activity over time, and recent classified log events.</desc>
  <defs>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62d5a4" stop-opacity=".22"/><stop offset="1" stop-color="#62d5a4" stop-opacity="0"/></linearGradient>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#8490a0}.main{fill:#ecf1f7}.small{font-size:12px}.tiny{font-size:10px}.label{fill:#a5afbd;font-size:12px}.metric{fill:#ecf1f7;font-size:30px;font-weight:650}.head{fill:#ecf1f7;font-size:14px;font-weight:600}.th{fill:#748192;font-size:9px;font-weight:600;letter-spacing:.8px}.row{fill:#c5cdd7;font-size:11px}.line{stroke:#252e38;stroke-width:1}.panel{fill:#11161d;stroke:#242c37}.cell{fill:#0d1117;stroke:#242c37}.green{fill:#62d5a4}.red{fill:#ff7d7d}.amber{fill:#f4bd61}
    </style>
  </defs>
  <rect width="1440" height="930" rx="20" fill="#0b0e12"/>
  <rect x="34" y="27" width="36" height="36" rx="11" fill="#15281f"/><text x="52" y="51" text-anchor="middle" fill="#62d5a4" font-size="18" font-weight="800">L</text>
  <text x="82" y="43" class="main" font-size="15" font-weight="650">Log Anomaly Detector</text><text x="82" y="60" class="muted tiny">Observability workspace</text>
  <circle cx="1255" cy="45" r="4" fill="#62d5a4"/><text x="1266" y="49" class="muted small">Live updates</text><rect x="1341" y="29" width="67" height="31" rx="7" class="cell"/><text x="1374" y="49" text-anchor="middle" class="muted small">All time</text><path d="M32 82H1408" class="line"/>
  <text x="36" y="119" fill="#62d5a4" font-size="10" font-weight="700" letter-spacing="1.5">SYSTEM OVERVIEW</text><text x="36" y="151" class="main" font-size="25" font-weight="650">Live log overview</text><text x="36" y="173" class="muted small">See activity and findings across your monitored logs.</text><text x="1404" y="171" text-anchor="end" class="muted tiny">Updated just now</text>
  <g transform="translate(36 198)"><rect class="panel" width="330" height="116" rx="11"/><text x="18" y="28" class="label">Log events processed</text><text x="18" y="71" class="metric">108</text><text x="18" y="96" class="muted tiny">Events analyzed by LAD</text></g>
  <g transform="translate(381 198)"><rect class="panel" width="330" height="116" rx="11"/><text x="18" y="28" class="label">Anomalies detected</text><text x="18" y="71" class="metric red">14</text><text x="18" y="96" class="muted tiny">14 require attention</text></g>
  <g transform="translate(726 198)"><rect class="panel" width="330" height="116" rx="11"/><text x="18" y="28" class="label">Anomaly rate</text><text x="18" y="71" class="metric amber">13%</text><text x="18" y="96" class="muted tiny">Of analyzed events</text></g>
  <g transform="translate(1071 198)"><rect class="panel" width="333" height="116" rx="11"/><text x="18" y="28" class="label">Services online</text><text x="18" y="71" class="metric green">2/2</text><text x="18" y="96" class="muted tiny">Fluentd · Qdrant</text></g>
  <g transform="translate(36 330)"><rect class="panel" width="850" height="235" rx="11"/><text x="20" y="28" class="head">Log activity</text><circle cx="740" cy="24" r="4" fill="#62d5a4"/><text x="751" y="28" class="muted tiny">Events</text>
    <path d="M60 58V190H820M60 157H820M60 124H820M60 91H820" class="line"/><text x="27" y="194" class="muted tiny">0</text><text x="20" y="160" class="muted tiny">25</text><text x="20" y="127" class="muted tiny">50</text><text x="20" y="94" class="muted tiny">75</text>
    <path d="M64 185L150 182L235 185L320 180L405 184L490 170L575 174L660 138L735 92L820 103V190H64Z" fill="url(#chartFill)"/><path d="M64 185L150 182L235 185L320 180L405 184L490 170L575 174L660 138L735 92L820 103" fill="none" stroke="#75d4ad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="216" class="muted tiny">12h ago</text><text x="310" y="216" class="muted tiny">8h</text><text x="555" y="216" class="muted tiny">4h</text><text x="795" y="216" class="muted tiny">Now</text>
  </g>
  <g transform="translate(902 330)"><rect class="panel" width="502" height="235" rx="11"/><text x="20" y="28" class="head">Connected services</text><text x="480" y="28" text-anchor="end" class="muted tiny">Runtime health</text><path d="M20 52H482M20 117H482M20 182H482" class="line"/>
    <circle cx="31" cy="83" r="4" fill="#62d5a4"/><text x="46" y="81" class="row">Fluentd</text><text x="46" y="98" class="muted tiny">Log collection</text><text x="478" y="87" text-anchor="end" class="green tiny">Operational</text>
    <circle cx="31" cy="148" r="4" fill="#62d5a4"/><text x="46" y="146" class="row">Qdrant</text><text x="46" y="163" class="muted tiny">Vector database</text><text x="478" y="152" text-anchor="end" class="green tiny">Operational</text>
  </g>
  <g transform="translate(36 581)"><rect class="panel" width="1368" height="316" rx="11"/><text x="20" y="29" class="head">Recent log events</text><text x="20" y="49" class="muted tiny">Latest classified events, with model and source details</text><rect x="1045" y="14" width="148" height="29" rx="6" class="cell"/><text x="1057" y="33" class="muted tiny">Search logs…</text><rect x="1203" y="14" width="145" height="29" rx="6" class="cell"/><text x="1216" y="33" class="muted tiny">All events</text><path d="M0 64H1368" class="line"/>
    <text x="20" y="87" class="th">STATUS</text><text x="166" y="87" class="th">LOG MESSAGE</text><text x="820" y="87" class="th">SOURCE</text><text x="966" y="87" class="th">MODEL</text><text x="1180" y="87" class="th">DETECTED ISSUE</text><text x="1324" y="87" text-anchor="end" class="th">TIME</text><path d="M0 99H1368" class="line"/>
    <rect x="20" y="114" width="72" height="22" rx="11" fill="#1b2925"/><circle cx="32" cy="125" r="3" fill="#62d5a4"/><text x="40" y="129" fill="#62d5a4" class="tiny">Anomaly</text><text x="166" y="129" class="row">ERROR upstream connection refused; retry limit exceeded</text><text x="820" y="129" class="muted tiny">api-gateway.log</text><text x="966" y="129" class="row">Claude · Opus</text><text x="1180" y="129" class="row">connection_error</text><text x="1324" y="129" text-anchor="end" class="muted tiny">00:14:22</text><path d="M18 148H1350" class="line"/>
    <rect x="20" y="164" width="84" height="22" rx="11" fill="#301f22"/><circle cx="32" cy="175" r="3" fill="#ff7d7d"/><text x="40" y="179" fill="#ff9b9b" class="tiny">Needs review</text><text x="166" y="179" class="row">WARN authentication rate limit exceeded</text><text x="820" y="179" class="muted tiny">service.log</text><text x="966" y="179" class="row">Rules fallback</text><text x="1180" y="179" class="row">unclassified</text><text x="1324" y="179" text-anchor="end" class="muted tiny">00:13:58</text><path d="M18 198H1350" class="line"/>
    <rect x="20" y="214" width="62" height="22" rx="11" fill="#1b2925"/><circle cx="32" cy="225" r="3" fill="#62d5a4"/><text x="40" y="229" fill="#62d5a4" class="tiny">Normal</text><text x="166" y="229" class="row">GET /health returned 200 response_time=0.004s</text><text x="820" y="229" class="muted tiny">web.log</text><text x="966" y="229" class="row">Qwen</text><text x="1180" y="229" class="muted tiny">—</text><text x="1324" y="229" text-anchor="end" class="muted tiny">00:13:41</text><path d="M18 248H1350" class="line"/>
    <text x="20" y="280" class="muted tiny">Illustrative sample · your live event stream appears here</text>
  </g>
  <text x="36" y="918" class="muted tiny">LAD · Local log intelligence</text><text x="1404" y="918" text-anchor="end" class="muted tiny">Auto-refreshes every 3 seconds</text>
</svg>
