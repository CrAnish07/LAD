<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">How LAD processes a log event</title>
  <desc id="desc">A watched log file is tailed by the LAD daemon and forwarded through Fluentd. LAD groups and triages events, retrieves trusted historical context from Qdrant using Gemini embeddings, sends selected groups to configured model providers, then stores the result for the dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b20"/><stop offset="1" stop-color="#0b1215"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#baf5d8"/><stop offset="1" stop-color="#5dd3a1"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#60957e"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{fill:#edf5ef;font-size:16px;font-weight:650}.sub{fill:#93a49e;font-size:11px}.tag{fill:#70d5aa;font-size:10px;font-weight:700;letter-spacing:1px}.num{fill:#70d5aa;font-size:10px;font-weight:700}.box{fill:#131d22;stroke:#2b3b3c}.arrow{fill:none;stroke:#60957e;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="430" rx="24" fill="url(#bg)"/>
  <text x="40" y="44" class="tag">FROM RAW LOG TO ACTIONABLE SIGNAL</text>
  <text x="1240" y="44" text-anchor="end" class="sub">LAD analyzes grouped events, not every raw line</text>
  <path class="arrow" d="M196 176h25M373 176h25M550 176h25M727 176h25M904 176h25M1081 176h25"/>
  <g transform="translate(38 94)"><rect class="box" width="158" height="166" rx="14"/><text x="17" y="27" class="num">01 · SOURCE</text><text x="17" y="65" class="title">Your log files</text><text x="17" y="91" class="sub">Application and</text><text x="17" y="108" class="sub">system logs</text><path d="M17 140h78" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(215 94)"><rect class="box" width="158" height="166" rx="14"/><text x="17" y="27" class="num">02 · COLLECT</text><text x="17" y="65" class="title">LAD watcher</text><text x="17" y="91" class="sub">Tails configured files</text><text x="17" y="108" class="sub">and forwards new lines</text><path d="M17 140h76" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(392 94)"><rect class="box" width="158" height="166" rx="14"/><text x="17" y="27" class="num">03 · BUFFER</text><text x="17" y="65" class="title">Fluentd</text><text x="17" y="91" class="sub">Buffers and writes</text><text x="17" y="108" class="sub">the incoming stream</text><path d="M17 140h53" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(569 94)"><rect class="box" width="158" height="166" rx="14"/><text x="17" y="27" class="num">04 · PREPARE</text><text x="17" y="65" class="title">Group &amp; triage</text><text x="17" y="91" class="sub">Deduplicates bursts;</text><text x="17" y="108" class="sub">filters routine events</text><path d="M17 140h98" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(746 94)"><rect class="box" width="158" height="166" rx="14"/><text x="17" y="27" class="num">05 · ADD CONTEXT</text><text x="17" y="65" class="title">Qdrant + Gemini</text><text x="17" y="91" class="sub">Searches trusted history</text><text x="17" y="108" class="sub">for related log context</text><path d="M17 140h117" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(923 94)"><rect class="box" width="158" height="166" rx="14"/><text x="17" y="27" class="num">06 · ANALYZE</text><text x="17" y="65" class="title">Your model choice</text><text x="17" y="91" class="sub">Configured provider</text><text x="17" y="108" class="sub">classifies selected groups</text><path d="M17 140h109" stroke="#70d5aa" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(1100 94)"><rect width="142" height="166" rx="14" fill="#14241d" stroke="#3c7058"/><text x="15" y="27" class="num">07 · REVIEW</text><text x="15" y="65" class="title">Dashboard</text><text x="15" y="91" class="sub">Live status, findings</text><text x="15" y="108" class="sub">and suggested fixes</text><path d="M15 140h82" stroke="url(#mint)" stroke-width="2" stroke-linecap="round"/></g>
  <path d="M825 263v53H648v-43" fill="none" stroke="#405c50" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <text x="735" y="340" text-anchor="middle" class="sub">Retrieved historical snippets add context. Live events aren’t added to the reference corpus.</text>
  <text x="40" y="397" class="sub">Rule matches are handled locally; model workers focus on groups routed for deeper analysis.</text>
</svg>
