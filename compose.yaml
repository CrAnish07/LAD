services:
  lad:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      - fluentd
      - qdrant
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8080
      FLUENTD_HOST: fluentd
      FLUENTD_PORT: 24224
      QDRANT_HOST: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-}
      NANOGPT_API_KEY: ${NANOGPT_API_KEY:-}
      REQUESTY_API_KEY: ${REQUESTY_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AUTH_TOKEN: ${CLOUDFLARE_AUTH_TOKEN:-}
    volumes:
      - lad_logs:/app/daemon/logs
      - ./data/sample_logs:/var/log/lad:ro
      - ./daemon/config.docker.yaml:/app/daemon/config.docker.yaml:ro

  fluentd:
    image: fluent/fluentd:v1.16-1
    restart: unless-stopped
    ports:
      - "24224:24224"
    volumes:
      - ./daemon/fluent.conf:/fluentd/etc/fluent.conf:ro
      - lad_logs:/fluentd/log

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  lad_logs:
  qdrant_storage:
